[project]
name = "agentgate-evaluator"
version = "0.2.0"
description = "Evaluation service for AgentGate"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.142,<1.0",
  "openai>=3.0,<4.0",
  "pydantic>=2.10,<3.0",
  "uvicorn[standard]>=0.35,<1.0"
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1.0"]

[tool.ruff]
line-length = 100
