name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  evaluator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/evaluator/pyproject.toml
      - name: Install evaluator
        run: python -m pip install -e services/evaluator
      - name: Run evaluator unit tests
        run: python -m unittest discover -s services/evaluator/tests -p 'test_*.py'

  cli-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate CLI syntax
        run: node --check packages/cli/bin/agentgate.mjs
      - name: Validate GitHub Action syntax
        run: node --check packages/action/index.mjs

  live-agent-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install evaluator
        run: python -m pip install -e services/evaluator
      - name: Start evaluator and mock agent
        run: |
          python -m uvicorn app.main:app --app-dir services/evaluator --host 127.0.0.1 --port 8000 > /tmp/agentgate-evaluator.log 2>&1 &
          python examples/customer-support/mock_agent.py > /tmp/agentgate-mock.log 2>&1 &
          for i in {1..30}; do
            curl --silent --fail http://127.0.0.1:8000/health && break
            sleep 1
          done
      - name: Evaluate live agent endpoint
        run: |
          node packages/cli/bin/agentgate.mjs eval \
            --dataset examples/customer-support/evals.live.jsonl \
            --agent-url http://127.0.0.1:8090 \
            --response-path data.answer \
            --project ci-live-agent

  web-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install
      - run: npm --workspace @agentgate/web run typecheck
